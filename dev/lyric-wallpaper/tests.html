<script>
  // Lyric Stage tests (browser mode, and Wallpaper Engine mode with ?we=1).
  // Every lyric line here is invented. Nothing reaches lrclib.net: the page
  // answers the lookups itself (fake lrclib below).
  window.__errs = [];
  window.addEventListener('error', function (e) { window.__errs.push(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  window.addEventListener('unhandledrejection', function (e) { window.__errs.push('unhandled rejection: ' + (e.reason && e.reason.message || e.reason)); });
  var WE = location.search.indexOf('we=1') >= 0;
  try { localStorage.clear(); } catch (e) {}
  // Wallpaper Engine mode: its listeners, registered before audio.js and media.js load
  window.__we = {};
  if (WE) {
    window.wallpaperRegisterAudioListener = function (cb) { window.__we.audio = cb; };
    window.wallpaperMediaIntegration = { PLAYBACK_STOPPED: 0, PLAYBACK_PLAYING: 1, PLAYBACK_PAUSED: 2 };
    ['Status', 'Properties', 'Thumbnail', 'Playback', 'Timeline'].forEach(function (n) {
      window['wallpaperRegisterMedia' + n + 'Listener'] = function (cb) { window.__we[n.toLowerCase()] = cb; };
    });
  }
</script>

<script>
  // A fake lrclib.net with invented songs (installed before main.js)
  var LRC_A = [
    '[00:02.00]First test line',
    '[00:05.00]The second line comes in',
    '[00:08.00]A third invented line',
    '[00:11.00]Number four is made up too',
    '[00:14.00]The fifth test line is a much longer invented sentence that has to wrap onto a second row of the stage',
    '[00:20.00]',
    '[00:30.00]Back after the pause',
    '[00:33.00]The last test line'
  ].join('\n');
  var LRC_CHAIN = '[00:02.00]Opening test line\n[00:05.00]A sung test line with a long tail\n[00:17.00]\n[00:27.00]After the long marker';
  var LRC_SHORT = '[00:01.00]Short test line one\n[00:04.00]Short test line two\n[00:07.00]Short test line three';
  var LRC_COUNT = '[00:02.00]Counted from the start\n[00:06.00]Still counting along\n[00:10.00]Third counted line';
  var DB = {};
  function entry(track, artist, dur, extra) {
    var e = { id: Object.keys(DB).length + 1, trackName: track, artistName: artist, albumName: 'Test Album', duration: dur, instrumental: false, plainLyrics: null, syncedLyrics: null };
    Object.keys(extra || {}).forEach(function (k) { e[k] = extra[k]; });
    DB[track.toLowerCase() + '|' + artist.toLowerCase()] = e;
  }
  entry('Lantern Test', 'The Invented Band', 200, { syncedLyrics: LRC_A, plainLyrics: 'First test line' });
  entry('Search Only Test', 'The Invented Band', 100, { syncedLyrics: LRC_SHORT, getMiss: true });
  entry('Cors Test', 'The Invented Band', 100, { syncedLyrics: LRC_SHORT });
  entry('Busy Test', 'The Invented Band', 100, { syncedLyrics: LRC_SHORT });
  entry('Plain Test', 'Nobody Real', 180, { plainLyrics: 'An invented plain line\nAnother plain test line\nThe plain end' });
  entry('Quiet Test', 'Ambient Nobody', 150, { instrumental: true });
  entry('Pause Chain Test', 'Test Artist', 60, { syncedLyrics: LRC_CHAIN });
  entry('Skip One', 'Skipper', 90, { syncedLyrics: LRC_SHORT });
  entry('Skip Two', 'Skipper', 90, { syncedLyrics: LRC_SHORT });
  entry('Skip Three', 'Skipper', 90, { syncedLyrics: LRC_SHORT });
  entry('No Clock Test', 'Quiet Player', 120, { syncedLyrics: LRC_COUNT });
  entry('Album Test', 'Color Band', 120, { syncedLyrics: LRC_SHORT });
  // Invented Arabic and Hebrew test lines ("an invented test line", "a made-up line for testing")
  entry('Rtl Test', 'Nobody', 60, { syncedLyrics: '[00:01.00]\u0633\u0637\u0631 \u062a\u062c\u0631\u064a\u0628\u064a \u0645\u062e\u062a\u0631\u0639\n[00:05.00]\u05e9\u05d5\u05e8\u05d4 \u05de\u05de\u05e6\u05d0\u05ea \u05dc\u05d1\u05d3\u05d9\u05e7\u05d4' });
  var BROKEN = { 'broken test': true, 'error test': true };
  var fakeLog = [], fakeOpts = [], fakeMode = { offline: false, cors: false, busy: 0 };
  function fakeResp(code, data, hdr) {
    return Promise.resolve({
      ok: code >= 200 && code < 300, status: code,
      headers: { get: function (k) { return hdr && hdr[k] !== undefined ? hdr[k] : null; } },
      json: function () { return Promise.resolve(data); }
    });
  }
  Lyric.lyrics.fetch = function (url, opts) {
    fakeLog.push(url);
    fakeOpts.push(opts || {});
    if (fakeMode.offline || (fakeMode.cors && opts && opts.headers)) return Promise.reject(new TypeError('Failed to fetch'));
    if (fakeMode.busy > 0) {
      fakeMode.busy--;
      return fakeResp(429, {}, { 'Retry-After': '0.2' });
    }
    var u = new URL(url), p = u.searchParams, get = /\/get$/.test(u.pathname);
    var track = (p.get('track_name') || '').toLowerCase(), artist = (p.get('artist_name') || '').toLowerCase(), q = (p.get('q') || '').toLowerCase();
    if (BROKEN[track] || Object.keys(BROKEN).some(function (b) { return q && q.indexOf(b) >= 0; })) return fakeResp(500, {});
    var hits = Object.keys(DB).filter(function (k) {
      var t = k.split('|')[0], a = k.split('|')[1];
      if (get) return t === track && a === artist && !DB[k].getMiss;
      return q ? q.indexOf(t) >= 0 : t === track && (!artist || a === artist);
    }).map(function (k) { return DB[k]; });
    if (get) return hits.length ? fakeResp(200, hits[0]) : fakeResp(404, { code: 404, name: 'TrackNotFound' });
    return fakeResp(200, hits);
  };
</script>

<script>
(async function () {
  var results = [], S = Lyric, app = S.app, set = S.settings, D = S.debug, I = S.i18n, ST = S.stage;
  var FAKE = S.lyrics.fetch;
  function check(name, ok, info) { results.push((ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : '  → ' + JSON.stringify(info))); }
  function note(msg) { results.push('INFO ' + msg); }
  function eff() { return D.effective(); }
  function st() { return D.state(); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function run(sec, dt) { dt = dt || 0.1; for (var f = 0, n = Math.round(sec / dt); f < n; f++) D.step(dt); }
  // A lookup: 600 ms of debounce, then the fake answers at once
  async function settle() { await sleep(900); D.step(0.05); }
  function near(a, b, eps) { return Math.abs(a - b) <= (eps || 1e-6); }
  function rgbOf(css) { return (String(css).match(/[\d.]+/g) || []).slice(0, 3).map(Number); }
  function bg() { return getComputedStyle(document.body).backgroundColor; }
  function panel() { return document.getElementById('ls-settings'); }
  function title() { return document.querySelector('#ls-settings header .ls-title span').textContent; }
  function lbl(k) { return document.querySelector('label[for=ls-opt-' + k + ']').textContent; }
  function since(n) { return fakeLog.slice(n).join(' '); }
  function png(a, b) {
    var c = document.createElement('canvas');
    c.width = 64; c.height = 36;
    var x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 64, 36);
    g.addColorStop(0, a); g.addColorStop(1, b);
    x.fillStyle = g; x.fillRect(0, 0, 64, 36);
    return c.toDataURL('image/png');
  }

  // Media events: in Wallpaper Engine mode through its listeners, in the
  // browser through the same functions (media.js exports them)
  var M = WE ? {
    status: function (e) { __we.status(e); }, props: function (e) { __we.properties(e); }, thumb: function (e) { __we.thumbnail(e); },
    play: function (e) { __we.playback(e); }, timeline: function (e) { __we.timeline(e); }
  } : { status: S.media.setStatus, props: S.media.setProperties, thumb: S.media.setThumbnail, play: S.media.setPlayback, timeline: S.media.setTimeline };
  function song(t, a) { M.props({ title: t, artist: a, albumTitle: 'Test Album' }); }
  function play(on) { M.play({ state: on === 'stop' ? 0 : on ? 1 : 2 }); }
  function tl(p, d) { M.timeline({ position: p, duration: d }); }
  var SOUND = [], SILENT = [];
  for (var z = 0; z < 128; z++) { SOUND.push(0.3); SILENT.push(0); }
  function sound(on) { (WE ? __we.audio : S.audio.feed)(on ? SOUND : SILENT); }
  // Back to the wallpaper (the song paused, the show faded out)
  function rest() { play(false); sound(false); run(D.cfg.returndelay + D.cfg.transition + 0.3); }

  try {
    // ---------------------------------------------------------------------
    // Start
    // ---------------------------------------------------------------------
    check('mode detected', app.isWE === WE, app.isWE);
    check('WebGL2: the shaders compile', D.renderer() === 'webgl2', D.renderer());
    if (WE) check('WE: media and audio listeners registered', ['audio', 'status', 'properties', 'thumbnail', 'playback', 'timeline'].every(function (k) { return typeof __we[k] === 'function'; }), Object.keys(__we));
    check('starts idle, on the Windows 11 style', st().mode === 'idle' && st().idle === 'win11', st());
    check('page background: the look\'s base color', bg() === 'rgb(221, 232, 245)', bg());
    check('menu built, light panel on the light look', !!panel() && panel().style.colorScheme === 'light', panel() && panel().style.colorScheme);

    // The automatic frame loop and the pause (headless Chrome's virtual time
    // hardly runs requestAnimationFrame: the loop is checked, not counted)
    check('the frame loop runs', st().loop && !st().paused, st());
    window.wallpaperPropertyListener.setPaused(true);
    check('paused: the loop stops', st().paused && !st().loop, st());
    window.wallpaperPropertyListener.setPaused(true);
    window.wallpaperPropertyListener.setPaused(false);
    check('resumed: the loop runs again', !st().paused && st().loop, st());

    // Idle and still: the loop dozes (no frames, a few checks a second)
    for (var w8 = 0; w8 < 20 && !st().dozing; w8++) await sleep(100);
    if (st().frames > 0) check('idle and still: the loop dozes (no frames)', st().dozing && st().loop, st());
    else note('no frame ran in virtual time: the dozing loop was not checked here');
    // Paused, a new size clears the canvas: it is drawn again at once
    window.wallpaperPropertyListener.setPaused(true);
    var rp = st().renders;
    app.setValue('quality', '0.5');
    check('paused: a new size is drawn at once', st().renders > rp && !st().loop, [st().renders - rp, st().loop]);
    app.setValue('quality', set.BY_KEY.quality.def);
    window.wallpaperPropertyListener.setPaused(false);

    // From here on, only step() moves the wallpaper (and the song clock)
    D.manual(true);
    check('manual frames: the loop stops', !st().loop && st().manual, st());
    window.wallpaperPropertyListener.setPaused(true);
    window.wallpaperPropertyListener.setPaused(false);
    check('manual frames: resuming does not restart it', !st().loop, st());
    if (WE) {
      D.step(0.05);
      check('WE: a song reported before main.js ran is picked up', st().title === 'Early Test' && st().synced && near(st().pos, 12, 0.01) && S.lyrics.state.key.indexOf('early test') >= 0, [st(), S.lyrics.state.key]);
    }

    // ---------------------------------------------------------------------
    // Lyrics engine: LRC, titles, song clock, lookup
    // ---------------------------------------------------------------------
    var P = S.lyrics.parseLRC;
    var r = P('[00:01.00]First test line\n[00:03.50]The second line comes in');
    check('LRC: lines with their start and end', JSON.stringify(r.lines.map(function (l) { return [l.t, l.end, l.text]; })) === '[[1,3.5,"First test line"],[3.5,9.5,"The second line comes in"]]', r.lines);
    r = P('[ar:Invented Artist]\n[offset:+500]\n[00:30.00]Chorus made up\n[00:10.00][00:50.00]Echo line invented\n[00:20.00]');
    check('LRC: tags, offset, several stamps per line, sorted, empty lines kept',
      JSON.stringify(r.lines.map(function (l) { return [l.t, l.text]; })) === '[[9.5,"Echo line invented"],[19.5,""],[29.5,"Chorus made up"],[49.5,"Echo line invented"]]', r.lines);
    r = P('[00:12.00]<00:12.00>Every <00:12.50>word <00:13.10>counts');
    check('LRC: word stamps', r.hasWords && r.lines[0].text === 'Every word counts' && r.lines[0].words.map(function (w) { return w.t; }).join() === '12,12.5,13.1', r.lines[0]);
    r = P('[00:01.00]An invented hook line\n[00:04.00]Something else made up\n[00:07.00]an invented hook, line!\n[00:09.00]oh\n[00:10.00]oh');
    check('LRC: lines that come back are the chorus (short ones are not)', r.lines.map(function (l) { return l.chorus ? 1 : 0; }).join('') === '10100', r.lines);
    var three = P('[00:01.00]a\n[00:03.00]b\n[00:05.00]c').lines;
    check('lineAt', [0, 1, 2.5, 3.5, 99].map(function (p) { return S.lyrics.lineAt(three, p); }).join() === '-1,0,0,1,2', null);
    function C(t, a) { var c = S.lyrics.cleanTitle(t, a); return c.track + ' | ' + c.artist; }
    check('titles: version tails', C('Lantern Test - Remastered 2011', 'The Invented Band') === 'Lantern Test | The Invented Band', C('Lantern Test - Remastered 2011', 'The Invented Band'));
    check('titles: video tags and credits', C('Lantern Test (feat. Someone Else) [Official Video]', 'The Invented Band') === 'Lantern Test | The Invented Band', C('Lantern Test (feat. Someone Else) [Official Video]', 'The Invented Band'));
    check('titles: YouTube channels', C('Lantern Test', 'The Invented Band - Topic') === 'Lantern Test | The Invented Band' &&
      C('The Invented Band - Lantern Test', 'TheInventedBandVEVO') === 'Lantern Test | The Invented Band',
      [C('Lantern Test', 'The Invented Band - Topic'), C('The Invented Band - Lantern Test', 'TheInventedBandVEVO')]);

    var K = S.songclock.create();
    K.reset(0);
    K.setPlaying(true, 0);
    check('song clock: counts from the start without reports', near(K.position(5000), 5) && !K.synced(), K.position(5000));
    K.timeline(30, 200, 5000);
    check('song clock: a far report is a seek', near(K.position(5000), 30) && K.synced() && K.duration() === 200, K.position(5000));
    K.timeline(30.6, 200, 6000);
    var back = false, prev = K.position(6000);
    for (var tm = 6000; tm <= 8000; tm += 16) { var pp = K.position(tm); if (pp < prev - 1e-9) back = true; prev = pp; }
    check('song clock: one report a little behind is a late snapshot, ignored', !back && near(K.position(8000), 33, 0.01), K.position(8000));
    // Reports behind several times in a row: it steps back by the smallest lead, never backwards
    K.timeline(33.5, 200, 9000);
    K.timeline(34.6, 200, 10000);
    K.timeline(35.4, 200, 11000);
    back = false; prev = K.position(11000);
    for (tm = 11000; tm <= 14000; tm += 16) { pp = K.position(tm); if (pp < prev - 1e-9) back = true; prev = pp; }
    check('song clock: consistently behind → steps back by the smallest lead, never backwards', !back && near(K.position(14000), 38.6, 0.01), K.position(14000));
    K.timeline(40, 200, 15000);
    check('song clock: a report ahead is taken', near(K.position(16000), 41, 0.01), K.position(16000));
    // Far behind: one report could be a very late snapshot; a second that agrees is going back
    K.timeline(20, 200, 16000);
    check('song clock: one report far behind waits for a second', near(K.position(16500), 41.5, 0.01), K.position(16500));
    K.timeline(21, 200, 17000);
    check('song clock: a second one that agrees goes back', near(K.position(17000), 21, 0.01), K.position(17000));
    // A short hold (silence) is not a pause: a stale report after it is still checked
    K.setPlaying(false, 18000, true);
    K.setPlaying(true, 18300, true);
    K.timeline(21.5, 200, 19000);
    check('song clock: after a short hold a late report does not pull it back', near(K.position(19000), 22.7, 0.01), K.position(19000));
    K.setPlaying(false, 8000);
    check('song clock: paused, it stands still', near(K.position(8000), K.position(20000)), [K.position(8000), K.position(20000)]);

    S.lyrics.debounceMs = 0;
    S.lyrics.maxRetryWait = 1;
    function look(meta) { return new Promise(function (res) { S.lyrics.load(meta, res); }); }
    var n0 = fakeLog.length, l1 = await look({ title: 'Search Only Test', artist: 'The Invented Band', duration: 100 });
    check('lookup: not at /get, found by search', l1.status === 'synced' && l1.match.source === 'search' && /\/get\?/.test(fakeLog[n0]), { r: l1.match, urls: since(n0) });
    n0 = fakeLog.length;
    var l2 = await look({ title: 'Search Only Test (Official Video)', artist: 'The Invented Band' });
    check('lookup: the same song again comes from the cache', l2.status === 'synced' && fakeLog.length === n0, since(n0));
    fakeMode.cors = true;
    n0 = fakeLog.length;
    var l3 = await look({ title: 'Cors Test', artist: 'The Invented Band' });
    fakeMode.cors = false;
    check('lookup: a refused header (CORS) is asked again without it', l3.status === 'synced' && fakeOpts.length - n0 === 2 && !fakeOpts[fakeOpts.length - 1].headers, { status: l3.status, n: fakeOpts.length - n0 });
    fakeMode.busy = 1;
    n0 = fakeLog.length;
    var l4 = await look({ title: 'Busy Test', artist: 'The Invented Band' });
    check('lookup: busy (429) waits Retry-After and asks again', l4.status === 'synced' && fakeLog.length - n0 === 2 && fakeMode.busy === 0, { status: l4.status, n: fakeLog.length - n0 });
    var l5 = await look({ title: 'Gone Test', artist: 'Nobody' });
    n0 = fakeLog.length;
    var l6 = await look({ title: 'Gone Test', artist: 'Nobody' });
    check('lookup: not found, and remembered', l5.status === 'notfound' && l6.status === 'notfound' && fakeLog.length === n0, [l5.status, l6.status, since(n0)]);
    var l7 = await look({ title: 'Broken Test', artist: 'Broken Server' });
    n0 = fakeLog.length;
    var l8 = await look({ title: 'Broken Test', artist: 'Broken Server' });
    check('lookup: a server error is not remembered', l7.status === 'error' && l8.status === 'error' && fakeLog.length > n0, [l7.status, l8.status]);
    S.lyrics.debounceMs = 600;
    S.lyrics.cancel();

    // ---------------------------------------------------------------------
    // Settings, themes, codes
    // ---------------------------------------------------------------------
    var neon = set.presetValues('neon');
    if (!WE) {
      app.setValue('preset', 'neon');
      check('theme copies its values', eff().bgstyle === neon.bgstyle && eff().lyricfont === neon.lyricfont, eff().bgstyle);
      check('theme resets what it does not set', eff().lyricpos === 'center' && eff().lyricsize === 1, eff().lyricpos);
      app.setValue('lyricsize', 1.5);
      check('a change makes it custom', app.getValues().preset === 'custom', app.getValues().preset);
      check('a change keeps the rest of the theme', eff().bgstyle === neon.bgstyle, eff().bgstyle);
      app.setValue('trigger', 'sound');
      window.wallpaperPropertyListener.applyUserProperties({ idleimage: { value: 'C:\\Users\\Test User\\Pictures\\private.jpg' } });
      var code = app.exportCode(), before = JSON.stringify(eff());
      check('export leaves the image path out', code.indexOf('LYRIC1:') === 0 && !('idleimage' in set.decode(code)) && set.decode(code).trigger === 'sound', set.decode(code));
      app.reset();
      check('defaults restored', eff().lyricsize === 1 && eff().trigger === 'auto' && eff().idleimage === '', eff());
      check('imports a code', app.importCode(code) === true, code);
      var after = JSON.parse(JSON.stringify(eff())), b = JSON.parse(before);
      delete after.preset; delete b.preset; delete b.idleimage; delete after.idleimage;
      check('export/import roundtrip', JSON.stringify(after) === JSON.stringify(b), { code: code });
      check('an invalid code is rejected', app.importCode('LYRIC1:junk!!') === false && app.importCode('') === false, null);
      check('imports plain JSON', app.importCode('{"lyricsize": 1.75, "nokey": 1}') && eff().lyricsize === 1.75, eff().lyricsize);
      check('sanitize clamps and rejects', set.sanitize('lyricsize', 99) === 2 && set.sanitize('bgstyle', 'xyz') === undefined && set.sanitize('idleimage', 5) === undefined, null);
      app.setValue('transition', 4.2);
      var saved = JSON.parse(localStorage.getItem('lyric-stage-settings') || '{}');
      check('saved in localStorage', saved.transition === 4.2, saved.transition);
      app.reset();
    } else {
      var all = {};
      set.SCHEMA.forEach(function (s) { all[s.key] = { value: s.def }; });

    msgEl = document.querySelector('.ls-hero-status.ls-on, .ls-status.ls-on');
    check('ar: menu right to left', panel().dir === 'rtl', panel().dir);
    check('ar: stage message right to left', msgEl && msgEl.dir === 'rtl', msgEl && msgEl.dir);
    app.setValue('language', 'auto');
    window.wallpaperPropertyListener.applyGeneralProperties({ language: 'ru-ru' });
    check('auto: the Wallpaper Engine language', I.lang() === 'ru' && title() === I.t('menu.title'), [I.lang(), title()]);
    app.setValue('language', 'en');
    check('en: menu in English', title() === 'Settings' && lbl('lyrics') === 'Show the lyrics', [title(), lbl('lyrics')]);

    // ---------------------------------------------------------------------
    // Resolution, FPS limit, themes
    // ---------------------------------------------------------------------
    app.setValue('quality', '0.75');
    var dpr = Math.min(window.devicePixelRatio || 1, 2), cv = document.getElementById('ls-canvas');
    check('render resolution 75%', D.size().W === Math.round(innerWidth * dpr * 0.75) && cv.width === D.size().W, [D.size(), cv.width]);
    app.setValue('quality', '0.5');
    if (WE) window.wallpaperPropertyListener.applyGeneralProperties({ fps: 30 });
    else app.setValue('fpslimit', '30');
    check('FPS limit', st().fps === 30, st().fps);
    if (WE) window.wallpaperPropertyListener.applyGeneralProperties({ fps: 0 });
    else app.setValue('fpslimit', '0');
    app.setValue('trigger', 'always');
    var bad = [];
    set.PRESETS.forEach(function (p) {
      app.setValue('preset', p.id);
      if (WE) window.wallpaperPropertyListener.applyUserProperties({ preset: { value: p.id } });
      try { run(0.5); } catch (e) { bad.push(p.id + ': ' + e.message); }
    });
    check('every theme runs', !bad.length, bad);
    app.setValue('preset', 'stage');
    if (WE) window.wallpaperPropertyListener.applyUserProperties({ preset: { value: 'stage' } });
    ['spotlights', 'cover', 'minimal', 'aurora'].forEach(function (b) {
      app.setValue('bgstyle', b);
      try { run(0.3); } catch (e) { bad.push(b + ': ' + e.message); }
    });
    ['words', 'fade', 'karaoke'].forEach(function (a) {
      app.setValue('lyricanim', a);
      try { run(0.3); } catch (e) { bad.push(a + ': ' + e.message); }
    });
    check('every background and animation runs', !bad.length, bad);
    app.setValue('trigger', 'auto');
    rest();

    // ---------------------------------------------------------------------
    // The console demo
    // ---------------------------------------------------------------------
    var demo = D.demo();
    await settle();
    run(9);
    s = st();
    check('demo: the show plays an invented song', s.mode === 'show' && s.title === 'Invented Demo Song' && s.lyrics === 'synced' && s.line === 0 && s.cover, s);
    check('demo: the stage sings its first line', ST.state().cur === s.text && /^First demo line/.test(s.text), ST.state());
    demo.seek(41);
    D.step(0.1);
    check('demo: seek', st().line === 7, st());
    demo.pause();
    run(D.cfg.returndelay + D.cfg.transition + 0.2);
    check('demo: paused, back to the wallpaper', st().mode === 'idle', st());
    demo.stop();
    check('demo: stop puts lrclib back', S.lyrics.fetch === FAKE && !st().demo, st().demo);
    var demo2 = D.demo({ words: true, timeline: false, title: 'Another Invented Song' });
    await settle();
    run(1.5);
    check('demo: word stamps, a player without a timeline', S.lyrics.state.hasWords && !st().synced && st().mode === 'show', st());
    demo2.stop();
    rest();

    // ---------------------------------------------------------------------
    // WebGL context lost for good → Canvas 2D
    // ---------------------------------------------------------------------
    app.setValue('trigger', 'always');
    run(1.2);
    var glc = document.getElementById('ls-canvas').getContext('webgl2'), ext = glc && glc.getExtension('WEBGL_lose_context');
    if (ext) {
      ext.loseContext();
      await sleep(50);
      run(3.5);
      var cv2 = document.getElementById('ls-canvas'), rr = st().renders;
      run(1);
      check('WebGL context lost for good: Canvas 2D takes over', D.renderer() === '2d' && cv2 !== cv && !!cv2.getContext('2d') && st().renders > rr && cv2.width === D.size().W, [D.renderer(), st().renders - rr]);
      app.setValue('trigger', 'auto');
      rest();
      check('Canvas 2D: back to the wallpaper', st().mode === 'idle', st());
    } else {
      note('WEBGL_lose_context unavailable: the Canvas 2D fallback was not tested');
    }
  } catch (e) {
    results.push('EXCEPTION ' + e.message + ' ' + (e.stack || '').split('\n').slice(0, 3).join(' | '));
  }

  check('no JS errors', !window.__errs.length, window.__errs.slice(0, 5));
  results.push('ERRORS: ' + JSON.stringify(window.__errs.slice(0, 5)) + ' total=' + window.__errs.length);
  document.getElementById('out').textContent = results.join(String.fromCharCode(10)) + String.fromCharCode(10) + 'DONE';
})();
</script>
</body>
</html>
