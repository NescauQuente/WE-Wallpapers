<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starry Wallpaper</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: hsl(217, 64%, 6%);
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<script>
(function () {
  // Configurações
  var hue = 217;        // tom do azul (0-360)
  var maxStars = 1200;  // quantidade de estrelas

  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var w, h;
  var stars = [];

  // Sprite da estrela pré-renderizado (brilho radial)
  var sprite = document.createElement('canvas');
  var sctx = sprite.getContext('2d');
  sprite.width = sprite.height = 100;
  var half = sprite.width / 2;
  var gradient = sctx.createRadialGradient(half, half, 0, half, half, half);
  gradient.addColorStop(0.025, '#fff');
  gradient.addColorStop(0.1, 'hsl(' + hue + ', 61%, 33%)');
  gradient.addColorStop(0.25, 'hsl(' + hue + ', 64%, 6%)');
  gradient.addColorStop(1, 'transparent');
  sctx.fillStyle = gradient;
  sctx.beginPath();
  sctx.arc(half, half, half, 0, Math.PI * 2);
  sctx.fill();

  function random(min, max) {
    if (arguments.length < 2) { max = min; min = 0; }
    if (min > max) { var t = max; max = min; min = t; }
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function maxOrbit(x, y) {
    var max = Math.max(x, y);
    return Math.round(Math.sqrt(max * max + max * max)) / 2;
  }

  function Star() {
    this.orbitRadius = random(maxOrbit(w, h));
    this.radius = random(60, this.orbitRadius) / 12;
    this.timePassed = random(0, maxStars);
    this.speed = random(this.orbitRadius) / 900000;
    this.alpha = random(2, 10) / 10;
  }

  Star.prototype.draw = function () {
    var x = Math.sin(this.timePassed) * this.orbitRadius + w / 2;
    var y = Math.cos(this.timePassed) * this.orbitRadius + h / 2;
    var twinkle = random(10);

    if (twinkle === 1 && this.alpha > 0) this.alpha -= 0.05;
    else if (twinkle === 2 && this.alpha < 1) this.alpha += 0.05;

    ctx.globalAlpha = this.alpha;
    ctx.drawImage(sprite, x - this.radius / 2, y - this.radius / 2, this.radius, this.radius);
    this.timePassed += this.speed;
  };

  function init() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    stars = [];
    for (var i = 0; i < maxStars; i++) stars.push(new Star());
  }

  function animation() {
    // Fundo semi-transparente: cria o leve rastro das estrelas
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = 'hsla(' + hue + ', 64%, 6%, 1)';
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < stars.length; i++) stars[i].draw();

    requestAnimationFrame(animation);
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 150);
  });

  init();
  animation();
})();
</script>
</body>
</html>
