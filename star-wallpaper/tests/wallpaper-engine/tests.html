<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>tests</title></head>
<body>
<canvas id="so-stars"></canvas>
<pre id="out">running</pre>
<script>
  window.__errs = []; window.addEventListener('error', function (e) { window.__errs.push(e.message + ' @' + (e.filename||'').split('/').pop() + ':' + e.lineno); });
  var WE = location.search.indexOf('we=1') >= 0;
  try { localStorage.clear(); } catch (e) {}
  if (WE) window.wallpaperRegisterAudioListener = function (cb) { window.__weAudio = cb; };
</script>
<script src="/wallpaper-engine/js/util.js"></script>
<script src="/wallpaper-engine/js/settings.js"></script><script src="/wallpaper-engine/js/i18n.js"></script>
<script src="/wallpaper-engine/js/lang/ar.js"></script><script src="/wallpaper-engine/js/lang/be.js"></script><script src="/wallpaper-engine/js/lang/bg.js"></script><script src="/wallpaper-engine/js/lang/ca.js"></script><script src="/wallpaper-engine/js/lang/cs.js"></script><script src="/wallpaper-engine/js/lang/de.js"></script><script src="/wallpaper-engine/js/lang/el.js"></script><script src="/wallpaper-engine/js/lang/es.js"></script><script src="/wallpaper-engine/js/lang/fr.js"></script><script src="/wallpaper-engine/js/lang/hr.js"></script><script src="/wallpaper-engine/js/lang/hu.js"></script><script src="/wallpaper-engine/js/lang/id.js"></script><script src="/wallpaper-engine/js/lang/it.js"></script><script src="/wallpaper-engine/js/lang/ja.js"></script><script src="/wallpaper-engine/js/lang/ko.js"></script><script src="/wallpaper-engine/js/lang/nl.js"></script><script src="/wallpaper-engine/js/lang/no.js"></script><script src="/wallpaper-engine/js/lang/pl.js"></script><script src="/wallpaper-engine/js/lang/pt.js"></script><script src="/wallpaper-engine/js/lang/pt-pt.js"></script><script src="/wallpaper-engine/js/lang/ro.js"></script><script src="/wallpaper-engine/js/lang/ru.js"></script><script src="/wallpaper-engine/js/lang/sk.js"></script><script src="/wallpaper-engine/js/lang/sl.js"></script><script src="/wallpaper-engine/js/lang/sv.js"></script><script src="/wallpaper-engine/js/lang/tr.js"></script><script src="/wallpaper-engine/js/lang/uk.js"></script><script src="/wallpaper-engine/js/lang/vi.js"></script><script src="/wallpaper-engine/js/lang/zh-cn.js"></script><script src="/wallpaper-engine/js/lang/zh-tw.js"></script>
<script src="/wallpaper-engine/js/noise.js"></script>
<script src="/wallpaper-engine/js/nebula.js"></script><script src="/wallpaper-engine/js/nebula-gl.js"></script>
<script src="/wallpaper-engine/js/audio.js"></script><script src="/wallpaper-engine/js/media.js"></script>
<script src="/wallpaper-engine/js/clock.js"></script>
<script src="/wallpaper-engine/js/lens.js"></script><script src="/wallpaper-engine/js/planets.js"></script><script src="/wallpaper-engine/js/events.js"></script><script src="/wallpaper-engine/js/menu.js"></script>
<script src="/wallpaper-engine/js/main.js"></script>
<script>
(async function () {
  var results = [], S = Starry, app = S.app, set = S.settings;
  function check(name, ok, info) { results.push((ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : '  → ' + JSON.stringify(info))); }
  function eff() { return S.debug.effective(); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var brasa = set.presetValues('brasa');

  check('modo detectado', app.isWE === WE, app.isWE);
  check('shaders compilam: nebulosa fluida e lente', S.debug.nebulaGL() && S.debug.lensOK(), { nebula: S.debug.nebulaGL(), lens: S.debug.lensOK() });

  if (!WE) {
    // Tema no navegador: copia valores e vira "Personalizado" ao mexer
    app.setValue('preset', 'brasa');
    check('tema copia cor', set.equal(eff().starcolor, brasa.starcolor), eff().starcolor);
    check('tema reseta não-definidos', eff().starsize === 1, eff().starsize);
    app.setValue('starsize', 2);
    check('ajuste vira personalizado', app.getValues().preset === 'custom', app.getValues().preset);
    check('ajuste mantém o resto do tema', set.equal(eff().starcolor, brasa.starcolor), eff().starcolor);

    // Exportar / importar
    app.setValue('clock', true);
    var code = app.exportCode();
    var before = JSON.stringify(eff());
    app.reset();
    check('reset volta ao padrão', eff().starsize === 1 && eff().clock === false, eff());
    check('importa código', app.importCode(code) === true, code);
    var after = JSON.parse(JSON.stringify(eff())); var b = JSON.parse(before);
    delete after.preset; delete b.preset;
    check('roundtrip export/import', JSON.stringify(after) === JSON.stringify(b), { code: code });
    check('código inválido rejeitado', app.importCode('STARRY1:lixo!!') === false && app.importCode('') === false, null);
    check('importa JSON puro', app.importCode('{"starsize": 2.5, "chavefalsa": 1}') && eff().starsize === 2.5, eff().starsize);
    check('sanitize limita faixa', set.sanitize('starsize', 99) === 3 && set.sanitize('colormode', 'xyz') === undefined, null);

    // Persistência
    app.setValue('speed', 4.2);
    var saved = JSON.parse(localStorage.getItem('starry-orbit-settings') || '{}');
    check('salva no localStorage', saved.speed === 4.2, saved.speed);

    // Áudio do navegador: oscilador de 60 Hz deve acender os graves
    try {
      var ac = new AudioContext(), osc = ac.createOscillator(), dest = ac.createMediaStreamDestination();
      osc.frequency.value = 60; osc.connect(dest); osc.start();
      S.audio.attach(dest.stream, 'mic');
      // Audio runs in real time and the page in virtual time: poll instead of a fixed wait
      var bands, low = 0, high = 0;
      for (var tries = 0; tries < 80 && !(low > 0.3 && low > high * 3); tries++) {
        await sleep(100);
        bands = Array.from(S.audio.state.bands);
        low = bands.slice(0, 8).reduce(function (a, v) { return a + v; }, 0) / 8;
        high = bands.slice(40).reduce(function (a, v) { return a + v; }, 0) / 24;
      }
      check('captura do navegador: grave > agudo', low > 0.3 && low > high * 3, { low: low, high: high, src: S.audio.state.source, ctx: ac.state });
      S.audio.stop();
      check('parar captura', S.audio.state.source === null, S.audio.state.source);
    } catch (e) { check('captura do navegador', false, String(e)); }
  } else {
    // WE: o painel manda tudo no início
    var all = {};
    set.SCHEMA.forEach(function (s) { all[s.key] = { value: s.def }; });
    all.preset = { value: 'brasa' };
    window.wallpaperPropertyListener.applyUserProperties(all);
    check('WE: tema é a base', set.equal(eff().starcolor, brasa.starcolor) && eff().colormode === 'varied', eff().starcolor);
    window.wallpaperPropertyListener.applyUserProperties({ starcolor: { value: '1 0 0' } });
    check('WE: ajuste do painel vence o tema', set.equal(eff().starcolor, '1 0 0'), eff().starcolor);
    check('WE: resto do tema mantido', eff().colorvariance === brasa.colorvariance, eff().colorvariance);
    window.wallpaperPropertyListener.applyUserProperties({ importcode: { value: set.encode({ starsize: 2.2, starcolor: '0 1 0' }) } });
    check('WE: código importado vence o tema', eff().starsize === 2.2, eff().starsize);
    check('WE: painel vence o código', set.equal(eff().starcolor, '1 0 0'), eff().starcolor);
    window.wallpaperPropertyListener.applyUserProperties({ starcolor: { value: '0.129 0.283 0.531' } });
    check('WE: voltar ao padrão devolve a camada de baixo', set.equal(eff().starcolor, '0 1 0'), eff().starcolor);
    window.wallpaperPropertyListener.applyGeneralProperties({ fps: 30 });
    check('WE: não grava localStorage', localStorage.getItem('starry-orbit-settings') === null, null);

    // Áudio do WE + batida → onda
    var frames = 0, t0 = performance.now();
    (function f() { frames++; if (performance.now() - t0 < 1000) requestAnimationFrame(f); })();
    await sleep(1100);
    results.push('INFO quadros/s no headless: ' + frames);

    // Detector de batida, determinístico: 4 s a 60 fps, batida a cada 0,5 s (120 BPM)
    var beats = 0, waves0 = 0, orig = S.audio.state.onBeat;
    S.audio.state.onBeat = function (s) { beats++; orig(s); };
    for (var f = 0; f < 240; f++) {
      if (f % 2 === 0) {
        var beat = (f % 30) < 5 ? 1 : 0.12, a = [];
        for (var ch = 0; ch < 2; ch++) for (var i = 0; i < 64; i++) a.push(i < 8 ? beat * 0.8 : 0.1);
        window.__weAudio(a);
      }
      S.audio.update(1 / 60, true, 1);
    }
    S.audio.state.onBeat = orig;
    check('WE: batidas detectadas (120 BPM em 4 s → ~8)', beats >= 6 && beats <= 9, beats);
  }

  // Paralaxe (determinístico: 2 s de quadros a 60 fps)
  function run(sec) { for (var f = 0; f < sec * 60; f++) S.debug.step(1 / 60); }
  window.dispatchEvent(new MouseEvent('mousemove', { clientX: innerWidth - 5, clientY: innerHeight - 5 }));
  run(2);
  var r0 = S.debug.regions()[0];
  check('paralaxe segue o mouse', r0.px < -0.5 * r0.parMax && r0.py < -0.2 * r0.parMax, { px: r0.px, py: r0.py, max: r0.parMax });
  app.setValue('parallax', false);
  run(2);
  check('paralaxe desligada volta ao centro', Math.abs(S.debug.regions()[0].px) < 0.5, S.debug.regions()[0].px);

  // Mouse: clique, segurar/arrastar (buraco negro)
  var canvasEl = document.getElementById('so-stars');
  function down(x, y) { canvasEl.dispatchEvent(new MouseEvent('mousedown', { clientX: x, clientY: y, button: 0, bubbles: true })); }
  function move(x, y) { window.dispatchEvent(new MouseEvent('mousemove', { clientX: x, clientY: y })); }
  function up(x, y) { window.dispatchEvent(new MouseEvent('mouseup', { clientX: x, clientY: y, button: 0 })); }
  function stepN(n) { for (var f = 0; f < n; f++) S.debug.step(1 / 60); }
  var HO = S.debug.hole;
  app.setValue('parallax', false);
  stepN(5);
  var w0 = S.debug.waveCount();
  down(120, 120); up(120, 120);
  check('clique (soltar sem arrastar) cria onda', S.debug.waveCount() === w0 + 1, S.debug.waveCount() - w0);
  var wClick = S.debug.waves()[S.debug.waves().length - 1];
  check('onda do clique é "+" (não espiral) e gira', wClick.spiral === false && (stepN(10), wClick.phase !== 2 * wClick.pol), { spiral: wClick.spiral, phase: wClick.phase });
  check('clique não cria buraco negro', !HO.active && HO.power === 0, HO);

  w0 = S.debug.waveCount();
  down(200, 200); move(260, 230);
  check('arrastar cria o buraco negro', HO.active === true, HO.active);
  stepN(60);
  check('buraco negro ganha força enquanto seguro', HO.power > 0.8 && HO.charge > 0.9, { power: HO.power, charge: HO.charge });
  move(320, 260); stepN(30);
  var dpr = window.devicePixelRatio || 1;
  check('buraco negro segue o cursor', Math.abs(HO.x - 320 * dpr) < 8 && Math.abs(HO.y - 260 * dpr) < 8, { x: HO.x, y: HO.y });
  // Estrelas perto do buraco somem no horizonte / são puxadas: medimos a distância média das mais próximas
  var reg = S.debug.regions()[0];
  var near = reg.stars.map(function (st) { return Math.hypot(st.sx - HO.x, st.sy - HO.y); }).sort(function (a, b) { return a - b; }).slice(0, 30);
  check('estrelas são atraídas para perto do buraco', near[29] < Math.min(innerWidth, innerHeight) * dpr * 0.2, near[29]);
  up(320, 260);
  check('soltar libera o buraco e dispara onda de choque', !HO.active && S.debug.waveCount() === w0 + 1, { active: HO.active, waves: S.debug.waveCount() - w0 });
  var lastWave = S.debug.waves()[S.debug.waves().length - 1];
  check('onda de choque mais forte após segurar ~1,5 s', lastWave.strength > 1.1, lastWave.strength);
  stepN(90);
  check('buraco negro some depois de soltar', HO.power === 0, HO.power);

  app.setValue('holedrag', false);
  w0 = S.debug.waveCount();
  down(200, 200); move(300, 300); stepN(30); up(300, 300);
  check('sem a opção, arrastar não cria buraco (vira clique)', !HO.active && HO.power === 0 && S.debug.waveCount() === w0 + 1, { active: HO.active, waves: S.debug.waveCount() - w0 });
  app.setValue('holedrag', true);

  // Planetas com física de verdade
  var PL = S.planets;
  var dprT = window.devicePixelRatio || 1, SW = innerWidth * dprT, SH = innerHeight * dprT;
  function offScreen(p) { return p.x < 0 || p.x > SW || p.y < 0 || p.y > SH; }
  function sim(n) { for (var f = 0; f < n; f++) PL.update(1 / 60, S.debug.holeEnv()); }
  stepN(80);   // garante que o buraco anterior terminou
  PL.reset();

  // 1) Planetas de passagem, sem buraco negro: entram, andam em linha reta e vão embora
  app.setValue('planetfreq', 12);
  sim(60 * 8);
  var passer = PL.list().filter(function (p) { return p.mode === 'pass'; })[0];
  check('planeta de passagem aparece sem buraco negro', !!passer, PL.count());
  var v0 = passer ? [passer.vx, passer.vy] : [0, 0];
  sim(60);
  check('sem buraco, segue em linha reta (velocidade constante)', passer && Math.abs(passer.vx - v0[0]) < 1e-6 && Math.abs(passer.vy - v0[1]) < 1e-6, { v0: v0, v: passer && [passer.vx, passer.vy] });
  var left = false;
  for (var q = 0; q < 60 * 45 && !left; q++) {
    var lastPos = [passer.x, passer.y];
    sim(1);
    if (PL.list().indexOf(passer) < 0) left = lastPos[0] < 0 || lastPos[0] > SW || lastPos[1] < 0 || lastPos[1] > SH;
  }
  check('planeta de passagem atravessa e sai pela borda', left, null);
  app.setValue('planetfreq', 3);
  PL.reset();

  // 2) Com o buraco: é capturado, espaguetificado e engolido
  down(400, 300); move(420, 310);
  stepN(50);
  check('sessão nova começa pequena', HO.mass === 0 && Math.abs(HO.grow - 1) < 0.01, { mass: HO.mass, grow: HO.grow });
  var tgt = S.debug.spawnPlanet(false, 'attract');
  check('planeta atraído nasce fora da tela', offScreen(tgt), [tgt.x, tgt.y]);
  var maxStretch = 0, sawDebris = 0;
  for (q = 0; q < 900 && PL.list().indexOf(tgt) >= 0; q++) {
    stepN(1);
    maxStretch = Math.max(maxStretch, tgt.stretch);
    sawDebris = Math.max(sawDebris, PL.count().debris);
  }
  check('planeta capturado pela gravidade é engolido', HO.mass >= 1, HO.mass);
  check('espaguetificação: planeta esticado', maxStretch > 0.5, maxStretch);
  check('espaguetificação: caudas de destroços', sawDebris > 40, sawDebris);
  stepN(90);
  check('buraco negro cresce devagar', HO.grow > 1.02, HO.grow);

  // 3) Não é mais "seco": mover o buraco não arrasta o planeta junto
  var free = S.debug.spawnPlanet(false, 'pass');
  free.x = HO.x + SW * 0.22; free.y = HO.y; free.vx = 0; free.vy = -SW * 0.05;
  stepN(2);
  var before = [free.x, free.y], holeBefore = [HO.x, HO.y];
  move(40, 310);
  stepN(1);
  var holeMoved = Math.hypot(HO.x - holeBefore[0], HO.y - holeBefore[1]);
  var planetMoved = Math.hypot(free.x - before[0], free.y - before[1]);
  check('mover o buraco não arrasta o planeta rigidamente', planetMoved < holeMoved * 0.3, { buraco: holeMoved, planeta: planetMoved });

  // 4) Soltar: o que não foi engolido segue o próprio impulso e vai embora
  var massBefore = HO.mass;
  up(40, 310);
  var escaped = false;
  for (q = 0; q < 60 * 40 && PL.list().indexOf(free) >= 0; q++) {
    var lp = [free.x, free.y];
    stepN(1);
    if (PL.list().indexOf(free) < 0) escaped = lp[0] < 0 || lp[0] > SW || lp[1] < 0 || lp[1] > SH;
  }
  check('ao soltar, o planeta escapa com o próprio impulso', escaped, { escaped: escaped, x: free.x, y: free.y });

  // 5) Gigante gasoso → jatos; rochoso → sem jatos
  stepN(90);
  app.setValue('planets', false); app.setValue('holeplanets', false);
  PL.reset();
  down(400, 300); move(420, 310); stepN(50);
  var rocky = S.debug.spawnPlanet(false, 'attract'), maxJet = 0;
  for (q = 0; q < 900 && PL.list().indexOf(rocky) >= 0; q++) { stepN(1); maxJet = Math.max(maxJet, PL.jetPower()); }
  check('planeta rochoso não dispara jatos', maxJet < 0.05, maxJet);
  var gp = S.debug.spawnPlanet(true, 'attract');
  for (q = 0; q < 900 && PL.list().indexOf(gp) >= 0; q++) { stepN(1); maxJet = Math.max(maxJet, PL.jetPower()); }
  for (q = 0; q < 30; q++) { stepN(1); maxJet = Math.max(maxJet, PL.jetPower()); }
  check('gigante gasoso engolido dispara jatos', maxJet > 0.8, maxJet);

  app.setValue('planets', true); app.setValue('holeplanets', true);

  // 6) Easter egg supermassivo
  HO.mass = 14;
  var wSuper = S.debug.waveCount();
  stepN(2);
  check('massa suficiente vira supermassivo', HO.supermassive === true, HO.supermassive);
  check('virar supermassivo solta uma onda', S.debug.waveCount() > wSuper, S.debug.waveCount() - wSuper);
  var wForm = S.debug.waves()[S.debug.waves().length - 1];
  check('a onda do supermassivo é uma espiral', wForm.spiral === true, wForm.spiral);
  stepN(200);
  check('disco de acreção aparece (transição completa)', HO.superT === 1 && HO.grow > 2, { superT: HO.superT, grow: HO.grow });
  var envS = S.debug.holeEnv();
  check('supermassivo: zona de maré nunca passa da tela', envS.tidal <= 0.3 * Math.min(SW, SH) + 1, envS.tidal);
  var bad = 0;
  for (q = 0; q < 12; q++) { var sp = S.debug.spawnPlanet(q % 3 === 0, 'attract'); if (!offScreen(sp)) bad++; }
  check('supermassivo: planetas sempre nascem fora da tela', bad === 0, bad);
  up(420, 310);
  var wl = S.debug.waves()[S.debug.waves().length - 1];
  check('soltar o supermassivo dá a maior onda', wl.strength >= 2.5, wl.strength);
  check('soltar o supermassivo solta uma espiral', wl.spiral === true, wl.spiral);
  stepN(120);
  check('sessão termina: buraco volta ao normal', HO.power === 0 && HO.mass === 0 && !HO.supermassive, { power: HO.power, mass: HO.mass, sup: HO.supermassive });
  PL.reset();

  // 7) Opções desligadas
  app.setValue('planets', false); app.setValue('holeplanets', false);
  down(400, 300); move(430, 320); stepN(60);
  sim(60 * 30);
  check('sem as opções, nenhum planeta aparece', PL.count().planets === 0, PL.count());
  up(430, 320); stepN(120);
  app.setValue('planets', true); app.setValue('holeplanets', true);
  PL.reset();

  // Raios em cadeia
  stepN(5);
  S.debug.spawnBolt('bass', 1.2);
  var bolt = S.debug.bolts()[0];
  check('raio de grave nasce com vários saltos', bolt && bolt.chains[0].path.length >= 5, bolt && bolt.chains[0].path.length);
  var hops = bolt.chains[0].path;
  var c0 = Math.hypot(hops[0].sx - reg.cx, hops[0].sy - reg.cy), cN = Math.hypot(hops[hops.length - 1].sx - reg.cx, hops[hops.length - 1].sy - reg.cy);
  check('raio de grave viaja do núcleo para fora', cN > c0 * 1.5, { inicio: c0, fim: cN });
  stepN(12);
  check('estrelas atingidas piscam', hops[1].flash > 0.2, hops[1].flash);
  stepN(80);
  check('raio termina sozinho', S.debug.bolts().length === 0, S.debug.bolts().length);
  S.debug.spawnBolt('spark', 1);
  var sp = S.debug.bolts()[0];
  check('faísca nasce na borda (agudos)', sp && sp.chains[0].path[0].frac >= 0.45, sp && sp.chains[0].path[0].frac);
  stepN(40);

  // Detector de agudos (determinístico: 2 s a 60 fps, ataque a cada 0,25 s)
  var hits = 0, tlog = [], origT = S.audio.state.onTreble;
  S.audio.state.onTreble = function () { hits++; };
  for (var f2 = -60; f2 < 120; f2++) {
    if (f2 === 0) hits = 0;
    if (f2 % 2 === 0) {
      var hit = (((f2 % 15) + 15) % 15) < 2 ? 1 : 0.05, arr = [];
      for (var ch2 = 0; ch2 < 2; ch2++) for (var b2 = 0; b2 < 64; b2++) arr.push(b2 >= 40 ? hit * 0.5 : 0.1);
      S.audio.feed(arr);
    }
    S.audio.update(1 / 60, true, 1);
    if (f2 >= 0 && f2 % 15 < 3) tlog.push(f2 + ':' + S.audio.state.treble.toFixed(2));
  }
  S.audio.state.onTreble = origT;
  check('agudos: ataques detectados após 1 s de adaptação (~8 em 2 s)', hits >= 5 && hits <= 9, { hits: hits, log: tlog.slice(0, 12).join(' ') });

  // Música: estrelas menores enquanto toca, de volta ao normal no silêncio
  function feedAll(v) { var arr = []; for (var c3 = 0; c3 < 128; c3++) arr.push(v); S.audio.feed(arr); }
  feedAll(0.3); stepN(90);
  check('com música as estrelas encolhem', S.debug.music() > 0.9, S.debug.music());
  feedAll(0); stepN(60 * 4);
  check('no silêncio voltam ao tamanho normal', S.debug.music() < 0.1, S.debug.music());
  app.setValue('audioshrink', false); feedAll(0.3); stepN(90);
  check('sem a opção, não encolhem', S.debug.music() < 0.01, S.debug.music());
  feedAll(0); app.setValue('audioshrink', true);
  app.setValue('parallax', true);

  // Drop → salto para o hiperespaço (determinístico: 26 s de música, 4 s de build-up sem grave, grave volta)
  var drops = 0, origDrop = S.audio.state.onDrop;
  S.audio.state.onDrop = function (st) { drops++; };
  function feedSong(kind, sec) {
    for (var f3 = 0; f3 < sec * 60; f3++) {
      if (f3 % 2 === 0) {
        var tt = f3 / 60, beat3 = (tt % 0.5) < 0.08, arr3 = [];
        for (var ch3 = 0; ch3 < 2; ch3++) for (var b3 = 0; b3 < 64; b3++) {
          arr3.push(kind === 'buildup' ? (b3 < 8 ? 0.01 : 0.35) : b3 < 8 ? (beat3 ? 0.8 : 0.25) : 0.3);
        }
        S.audio.feed(arr3);
      }
      S.audio.update(1 / 60, true, 1);
    }
  }
  feedSong('music', 26);
  var dropsBefore = drops;
  feedSong('buildup', 4); feedSong('music', 3);
  check('drop: grave voltando depois do build-up é detectado', drops === dropsBefore + 1, { antes: dropsBefore, depois: drops });
  feedSong('music', 20);
  check('música sem build-up não dispara drop', drops === dropsBefore + 1, drops);
  S.audio.state.onDrop = origDrop;
  feedAll(0);

  var WARP = S.debug.warp, sky0 = S.debug.skyShift(), wv0 = S.debug.waveTotal();
  check('hiperespaço começa', S.debug.hyperspace() === true, null);
  stepN(60);
  check('no meio do salto as estrelas viram riscos (nível máximo)', WARP.level > 0.95, WARP.level);
  stepN(150);
  check('salto termina e chega num céu novo', WARP.level === 0 && WARP.t < 0 && S.debug.skyShift() === sky0 + 1, { level: WARP.level, sky: S.debug.skyShift() });
  check('chegada solta uma onda', S.debug.waveTotal() > wv0, S.debug.waveTotal() - wv0);

  // Eventos raros
  var EV = S.events;
  check('supernova começa', S.debug.event('supernova') === true, null);
  var nova = EV.active().filter(function (e) { return e.kind === 'supernova'; })[0], wvN = S.debug.waveTotal();
  stepN(200);
  check('supernova explode: a estrela some e solta uma onda gravitacional', nova && nova.blown && nova.st.gone && S.debug.waveTotal() > wvN, { blown: nova && nova.blown });
  check('cometa aparece', S.debug.event('comet') === true && EV.active().some(function (e) { return e.kind === 'comet'; }), null);
  check('chuva de meteoros começa', S.debug.event('meteors') === true, null);
  stepN(120);
  var plN = S.planets.count().planets;
  check('desfile de planetas: 4 ou mais em fila', S.debug.event('parade') === true && S.planets.count().planets >= plN + 4, S.planets.count());
  stepN(30);
  app.setValue('screens', '2');
  check('mudar o layout limpa os eventos e devolve a estrela', EV.active().length === 0 && !nova.st.gone, EV.active().length);
  app.setValue('screens', '1');
  S.planets.reset();

  // Cores da capa do álbum e a música no relógio (a integração de mídia do WE, simulada)
  var M = S.media, cfgL = S.debug.cfg;
  app.setValue('clock', true);
  M.setStatus({ enabled: true });
  M.setProperties({ title: 'Song of the Stars', artist: 'The Band' });
  M.setThumbnail({ primaryColor: '#101010', secondaryColor: '#ff2a6d', tertiaryColor: '#05d9e8' });
  M.setPlayback({ state: 1 });
  stepN(300);
  var pink = M.paletteFrom(['#ff2a6d']).hue, dHue = Math.abs(((cfgL.hue - pink) % 360 + 540) % 360 - 180);
  check('com música tocando o céu pega a cor da capa', dHue < 12 && S.debug.albumMix() > 0.9, { hue: cfgL.hue, capa: pink });
  var songTxt = document.querySelector('#so-clock .so-song-title').textContent;
  check('relógio mostra a música', songTxt === 'Song of the Stars' && document.querySelector('#so-clock .so-clock-song').classList.contains('so-show'), songTxt);
  M.setPlayback({ state: 2 });
  stepN(60 * 12);
  check('parou a música: volta às cores do tema', cfgL.hue === cfgL.baseHue && S.debug.albumMix() < 0.01, { hue: cfgL.hue, base: cfgL.baseHue });
  check('parou a música: some do relógio', !document.querySelector('#so-clock .so-clock-song').classList.contains('so-show'), null);
  app.setValue('mediacolors', false);
  M.setPlayback({ state: 1 }); stepN(120);
  check('sem a opção, a capa não muda as cores', S.debug.albumMix() < 0.01, S.debug.albumMix());
  M.setPlayback({ state: 2 });
  app.setValue('mediacolors', true); app.setValue('clock', false);

  // Multi-monitor
  app.setValue('screens', '3');
  check('3 galáxias', S.debug.regions().length === 3, S.debug.regions().length);
  app.setValue('screens', '1');
  check('volta para 1', S.debug.regions().length === 1, S.debug.regions().length);

  // Pausa (o WE e o Live Wallpapers chamam setPaused quando o papel de parede fica coberto)
  var pst = S.debug.regions()[0].stars.filter(function (st) { return st.speed > 0; })[0];
  window.wallpaperPropertyListener.setPaused(true);
  var tPaused = pst.t;
  await sleep(600);
  check('pausado: nada se move', pst.t === tPaused, pst.t - tPaused);
  window.wallpaperPropertyListener.setPaused(false);
  for (var wp = 0; wp < 30 && pst.t === tPaused; wp++) await sleep(100);
  check('retomado: volta a se mover', pst.t !== tPaused, null);

  // Relógio 12h
  app.setValue('clock', true); app.setValue('clockformat', '12');
  await sleep(50);
  var txt = document.querySelector('#so-clock .so-clock-time').textContent;
  check('relógio 12h com AM/PM', /^\d{1,2}:\d\d(AM|PM)$/.test(txt), txt);

  // Idioma
  var I = S.i18n;
  function sub() { return document.querySelector('#so-settings header .so-title span').textContent; }
  function lbl(k) { return document.querySelector('label[for=so-opt-' + k + ']').textContent; }
  check('detecção: códigos do CasaOS, do WE e do navegador',
    I.detect('pt-BR') === 'pt' && I.detect('pt_PT') === 'pt-pt' && I.detect('portuguese') === 'pt' && I.detect('de-DE') === 'de' &&
    I.detect('zh-chs') === 'zh-cn' && I.detect('zh_tw') === 'zh-tw' && I.detect('zh-Hant-HK') === 'zh-tw' && I.detect('nb-NO') === 'no' &&
    I.detect('no_no') === 'no' && I.detect('sl_si') === 'sl' && I.detect('xx-YY') === 'en' && I.normalize === undefined, null);
  app.setValue('language', 'pt');
  check('pt: menu em português', I.lang() === 'pt' && sub() === 'Configurações' && lbl('wavedrag') === 'Peso das estrelas (deforma a frente)', { lang: I.lang(), sub: sub(), lbl: lbl('wavedrag') });
  check('pt: tema padrão', document.querySelector('#so-opt-preset option[value=safira]').textContent === 'Safira Noturna (Default)', null);
  app.setValue('language', 'en');
  check('en: menu em inglês', I.lang() === 'en' && sub() === 'Settings' && lbl('wavedrag') === 'Star weight (bends the front)', { lang: I.lang(), sub: sub() });
  check('en: tema padrão', document.querySelector('#so-opt-preset option[value=safira]').textContent === 'Sapphire Night (Default)', null);
  app.setValue('language', 'auto');
  window.wallpaperPropertyListener.applyGeneralProperties({ language: 'pt-br' });
  check('auto segue o idioma informado pelo WE (pt-br)', I.lang() === 'pt' && sub() === 'Configurações', I.lang());
  window.wallpaperPropertyListener.applyGeneralProperties({ language: 'ru-ru' });
  check('auto: russo do WE', I.lang() === 'ru' && sub() === 'Настройки', { lang: I.lang(), sub: sub() });
  window.wallpaperPropertyListener.applyGeneralProperties({ language: 'fa-ir' });
  check('auto: idioma não suportado cai no inglês', I.lang() === 'en', I.lang());
  app.setValue('language', 'ar');
  check('árabe: menu da direita para a esquerda', document.getElementById('so-settings').dir === 'rtl', document.getElementById('so-settings').dir);
  app.setValue('language', 'pt-pt');
  check('pt-pt: usa o pt como base', I.lang() === 'pt-pt' && sub() === 'Definições' && lbl('wavedrag') === 'Peso das estrelas (deforma a frente)', { sub: sub(), lbl: lbl('wavedrag') });
  app.setValue('clock', true); app.setValue('clockdate', true);
  app.setValue('language', 'pt');
  var dPt = document.querySelector('#so-clock .so-clock-date').textContent;
  app.setValue('language', 'en');
  var dEn = document.querySelector('#so-clock .so-clock-date').textContent;
  check('data do relógio segue o idioma', /feira|sábado|domingo/i.test(dPt) && /day/i.test(dEn), { pt: dPt, en: dEn });

  // Condições do menu
  check('condição eq', set.condMet([{ k: 'colormode', eq: 'varied' }], { colormode: 'varied' }) && !set.condMet([{ k: 'colormode', eq: 'varied' }], { colormode: 'single' }), null);

  results.push('ERROS: ' + JSON.stringify(window.__errs.slice(0, 5)) + ' total=' + window.__errs.length);
  document.getElementById('out').textContent = results.join('\n') + '\nDONE';
})();
</script>
</body>
</html>
