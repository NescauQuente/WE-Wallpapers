<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>tests</title>
<link rel="stylesheet" href="/wallpaper-engine/css/plexus.css"></head>
<body>
<canvas id="px-canvas"></canvas>
<pre id="out">running</pre>
<script>
  window.__errs = []; window.addEventListener('error', function (e) { window.__errs.push(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  var WE = location.search.indexOf('we=1') >= 0;
  try { localStorage.clear(); } catch (e) {}
  if (WE) window.wallpaperRegisterAudioListener = function (cb) { window.__weAudio = cb; };
</script>
<script src="/wallpaper-engine/js/util.js"></script>
<script src="/wallpaper-engine/js/settings.js"></script><script src="/wallpaper-engine/js/i18n.js"></script>
<script src="/wallpaper-engine/js/lang/ar.js"></script><script src="/wallpaper-engine/js/lang/be.js"></script><script src="/wallpaper-engine/js/lang/bg.js"></script><script src="/wallpaper-engine/js/lang/ca.js"></script><script src="/wallpaper-engine/js/lang/cs.js"></script><script src="/wallpaper-engine/js/lang/de.js"></script><script src="/wallpaper-engine/js/lang/el.js"></script><script src="/wallpaper-engine/js/lang/es.js"></script><script src="/wallpaper-engine/js/lang/fr.js"></script><script src="/wallpaper-engine/js/lang/hr.js"></script><script src="/wallpaper-engine/js/lang/hu.js"></script><script src="/wallpaper-engine/js/lang/id.js"></script><script src="/wallpaper-engine/js/lang/it.js"></script><script src="/wallpaper-engine/js/lang/ja.js"></script><script src="/wallpaper-engine/js/lang/ko.js"></script><script src="/wallpaper-engine/js/lang/nl.js"></script><script src="/wallpaper-engine/js/lang/no.js"></script><script src="/wallpaper-engine/js/lang/pl.js"></script><script src="/wallpaper-engine/js/lang/pt.js"></script><script src="/wallpaper-engine/js/lang/pt-pt.js"></script><script src="/wallpaper-engine/js/lang/ro.js"></script><script src="/wallpaper-engine/js/lang/ru.js"></script><script src="/wallpaper-engine/js/lang/sk.js"></script><script src="/wallpaper-engine/js/lang/sl.js"></script><script src="/wallpaper-engine/js/lang/sv.js"></script><script src="/wallpaper-engine/js/lang/tr.js"></script><script src="/wallpaper-engine/js/lang/uk.js"></script><script src="/wallpaper-engine/js/lang/vi.js"></script><script src="/wallpaper-engine/js/lang/zh-cn.js"></script><script src="/wallpaper-engine/js/lang/zh-tw.js"></script>
<script src="/wallpaper-engine/js/audio.js"></script>
<script src="/wallpaper-engine/js/media.js"></script>
<script src="/wallpaper-engine/js/clock.js"></script>
<script src="/wallpaper-engine/js/menu.js"></script>
<script src="/wallpaper-engine/js/net.js"></script>
<script src="/wallpaper-engine/js/shapes.js"></script>
<script src="/wallpaper-engine/js/pclock.js"></script>
<script src="/wallpaper-engine/js/scene.js"></script>
<script src="/wallpaper-engine/js/gl.js"></script>
<script src="/wallpaper-engine/js/render2d.js"></script>
<script src="/wallpaper-engine/js/main.js"></script>
<script>
(async function () {
  var results = [], S = Plexus, app = S.app, set = S.settings, D = S.debug, net = S.net;
  function check(name, ok, info) { results.push((ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : '  → ' + JSON.stringify(info))); }
  function eff() { return D.effective(); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function run(sec, dt) { dt = dt || 1 / 30; for (var f = 0; f < sec / dt; f++) D.step(dt); }
  function onScreen() {
    var A = net.a(), sz = D.size(), n = 0;
    for (var i = 0; i < net.n(); i++) if (A.VIS[i] > 0.3 && A.SX[i] > 0 && A.SX[i] < sz.W && A.SY[i] > 0 && A.SY[i] < sz.H) n++;
    return n;
  }
  function locked() { var A = net.a(), n = 0; for (var i = 0; i < net.n(); i++) n += A.LOCK[i]; return n; }
  var ember = set.presetValues('ember');

  check('modo detectado', app.isWE === WE, app.isWE);
  check('WebGL2: shaders compilam', D.renderer() === 'webgl2', D.renderer());

  if (!WE) {
    // Tema no navegador: copia valores e vira "Personalizado" ao mexer
    app.setValue('preset', 'ember');
    check('tema copia cor', set.equal(eff().nodecolor, ember.nodecolor), eff().nodecolor);
    check('tema reseta não-definidos', eff().nodesize === 1, eff().nodesize);
    app.setValue('nodesize', 2);
    check('ajuste vira personalizado', app.getValues().preset === 'custom', app.getValues().preset);
    check('ajuste mantém o resto do tema', set.equal(eff().nodecolor, ember.nodecolor), eff().nodecolor);

    // Exportar / importar
    app.setValue('clock', true);
    var code = app.exportCode();
    var before = JSON.stringify(eff());
    app.reset();
    check('reset volta ao padrão', eff().nodesize === 1 && eff().clock === false, eff());
    check('importa código', code.indexOf('PLEXUS1:') === 0 && app.importCode(code) === true, code);
    var after = JSON.parse(JSON.stringify(eff())), b = JSON.parse(before);
    delete after.preset; delete b.preset;
    check('roundtrip export/import', JSON.stringify(after) === JSON.stringify(b), { code: code });
    check('código inválido rejeitado', app.importCode('PLEXUS1:lixo!!') === false && app.importCode('') === false, null);
    check('importa JSON puro', app.importCode('{"nodesize": 2.5, "chavefalsa": 1}') && eff().nodesize === 2.5, eff().nodesize);
    check('sanitize limita faixa', set.sanitize('nodesize', 99) === 4 && set.sanitize('colormode', 'xyz') === undefined, null);
    app.setValue('speed', 4.2);
    var saved = JSON.parse(localStorage.getItem('neural-plexus-settings') || '{}');
    check('salva no localStorage', saved.speed === 4.2, saved.speed);
    app.reset();
  } else {
    // WE: o painel manda tudo no início; o tema é a base
    var all = {};
    set.SCHEMA.forEach(function (s) { all[s.key] = { value: s.def }; });
    all.preset = { value: 'ember' };
    window.wallpaperPropertyListener.applyUserProperties(all);
    check('WE: tema é a base', set.equal(eff().nodecolor, ember.nodecolor) && eff().bloomamt === ember.bloomamt, eff().nodecolor);
    window.wallpaperPropertyListener.applyUserProperties({ nodecolor: { value: '1 0 0' } });
    check('WE: ajuste do painel vence o tema', set.equal(eff().nodecolor, '1 0 0'), eff().nodecolor);
    window.wallpaperPropertyListener.applyUserProperties({ importcode: { value: set.encode({ nodesize: 2.2, nodecolor: '0 1 0' }) } });
    check('WE: código importado vence o tema', eff().nodesize === 2.2, eff().nodesize);
    check('WE: painel vence o código', set.equal(eff().nodecolor, '1 0 0'), eff().nodecolor);
    window.wallpaperPropertyListener.applyUserProperties({ nodecolor: { value: set.BY_KEY.nodecolor.def } });
    check('WE: voltar ao padrão devolve a camada de baixo', set.equal(eff().nodecolor, '0 1 0'), eff().nodecolor);
    check('WE: não grava localStorage', localStorage.getItem('neural-plexus-settings') === null, null);

    // Detector de batida: 4 s a 60 fps, batida a cada 0,5 s (120 BPM)
    var beats = 0, orig = S.audio.state.onBeat;
    S.audio.state.onBeat = function (s) { beats++; orig(s); };
    for (var f = 0; f < 240; f++) {
      if (f % 2 === 0) {
        var beat = (f % 30) < 5 ? 1 : 0.12, a = [];
        for (var ch = 0; ch < 2; ch++) for (var i = 0; i < 64; i++) a.push(i < 8 ? beat * 0.8 : 0.1);
        window.__weAudio(a);
      }
      S.audio.update(1 / 60, true, 1);
    }
    S.audio.state.onBeat = orig;
    check('WE: batidas detectadas (120 BPM em 4 s → ~8)', beats >= 6 && beats <= 9, beats);
    var silence = []; for (var z = 0; z < 128; z++) silence.push(0);
    window.__weAudio(silence);
    window.wallpaperPropertyListener.applyUserProperties({ preset: { value: 'circuit' }, importcode: { value: '' } });
  }
  app.setValue('shapefreq', 30);
  app.setValue('audioenabled', false);
  // Half resolution: the logic is the same and software rendering is 4× faster
  app.setValue('quality', '0.5');

  // A rede: nós pela proporção da tela, conexões e triângulos
  D.relayout();
  run(2);
  var area = Math.min(4, Math.max(0.3, innerWidth / innerHeight / (16 / 9)));
  check('quantidade de nós pela proporção da tela', net.n() === Math.round(300 * area), { n: net.n(), area: area });
  check('conexões e triângulos', net.links().n > net.n() * 0.6 && net.tris().n > 10, { links: net.links().n, tris: net.tris().n });
  var A = net.a(), finite = true;
  for (var q = 0; q < net.n(); q++) if (!isFinite(A.X[q] + A.Y[q] + A.Z[q] + A.SX[q])) finite = false;
  check('posições finitas', finite, null);

  // Clique: onda de choque que sobrecarrega os nós em volta (corredores)
  var sz = D.size();
  D.click(sz.W / 2, sz.H / 2);
  run(0.4);
  check('clique solta corredores sobrecarregados e uma onda de choque', net.signals().runners > 3 && D.shocks().length === 1, { runners: net.signals().runners, shocks: D.shocks().length });
  var jumps = 0, pops = 0;
  for (var st = 0; st < 120; st++) {
    D.step(1 / 30);
    var sg = net.signals();
    for (var g = 0; g < sg.n; g++) if (sg.kind[g] === 2) jumps++;
    pops = Math.max(pops, net.pops().n);
  }
  check('corredores saltam no vazio ou estouram', jumps > 0 || pops > 0, { jumps: jumps, pops: pops });
  run(3);
  check('a sobrecarga se apaga sozinha', net.signals().runners === 0 && net.pops().n === 0, { runners: net.signals().runners, pops: net.pops().n });
  // Saltos e estouros, determinísticos: um corredor num nó sem saída
  var A0 = net.a(), lone = net.nearest(sz.W / 2, sz.H / 2), id = net.newSurge();
  for (var q0 = 0; q0 < net.n(); q0++) if (q0 !== lone) A0.SURGE[q0] = id;
  var p0 = net.pops().n;
  net.launch(lone, id, 5, A0.SX[lone], A0.SY[lone]);
  check('sem nenhum nó por perto, o corredor estoura', net.pops().n === p0 + 1, net.pops().n - p0);
  var size1 = net.pops().s[net.pops().n - 1], ss1 = A0.SS[lone];
  run(1);
  // Força da sobrecarga: estouro maior
  app.setValue('surgeamt', 2.5);
  run(0.1);
  A0 = net.a(); lone = net.nearest(sz.W / 2, sz.H / 2); id = net.newSurge();
  for (q0 = 0; q0 < net.n(); q0++) if (q0 !== lone) A0.SURGE[q0] = id;
  net.launch(lone, id, 5, A0.SX[lone], A0.SY[lone]);
  check('força da sobrecarga aumenta o estouro', net.pops().s[net.pops().n - 1] / A0.SS[lone] > size1 / ss1 * 1.3, { antes: size1, depois: net.pops().s[net.pops().n - 1] });
  app.setValue('surgeamt', 1);
  run(1);
  app.setValue('signals', false);
  run(3);
  check('sinais desligados: nenhum sinal espontâneo', net.signals().n === 0, net.signals().n);
  app.setValue('signals', true);

  // Cursor: atrai os nós em volta
  app.setValue('mouseforce', 'attract');
  window.dispatchEvent(new MouseEvent('mousemove', { clientX: innerWidth / 2, clientY: innerHeight / 2 }));
  run(1);
  A = net.a();
  // Between its ring (closer in, nodes are held off) and its radius, the nodes move toward it
  var Rc = D.cfg.mouseradius * sz.unit, inward = 0, nIn = 0;
  for (var k = 0; k < net.n(); k++) {
    var dx = A.SX[k] - sz.W / 2, dy = A.SY[k] - sz.H / 2, dc = Math.hypot(dx, dy);
    if (A.LOCK[k] || dc < Rc * 0.45 || dc > Rc * 0.9) continue;
    inward -= (A.IX[k] * dx + A.IY[k] * dy) / dc;
    nIn++;
  }
  check('cursor atrai os nós', nIn > 0 && inward > 0, { nodes: nIn, inward: inward });
  run(6);
  A = net.a();
  var nearC = [], tight = 0;
  for (k = 0; k < net.n(); k++) { var mx = A.SX[k] - sz.W / 2, my = A.SY[k] - sz.H / 2; if (mx * mx + my * my < Math.pow(200 * sz.unit, 2) && !A.LOCK[k]) nearC.push(k); }
  for (k = 0; k < nearC.length; k++) for (var k2 = k + 1; k2 < nearC.length; k2++) { var px2 = A.SX[nearC[k]] - A.SX[nearC[k2]], py2 = A.SY[nearC[k]] - A.SY[nearC[k2]]; if (px2 * px2 + py2 * py2 < Math.pow(8 * sz.unit, 2)) tight++; }
  check('mouse parado: os nós não se empilham', tight === 0, { perto: nearC.length, colados: tight });
  document.dispatchEvent(new MouseEvent('mouseleave'));

  // Singularidade: segurar e arrastar, soltar explode
  var canvasEl = document.getElementById('px-canvas');
  var cx = innerWidth / 2, cy = innerHeight / 2;
  canvasEl.dispatchEvent(new MouseEvent('mousedown', { clientX: cx, clientY: cy, button: 0, bubbles: true }));
  window.dispatchEvent(new MouseEvent('mousemove', { clientX: cx + 30, clientY: cy }));
  check('arrastar cria a singularidade', D.sing.on === true, D.sing.on);
  function near(r) { var A2 = net.a(), n = 0; for (var i = 0; i < net.n(); i++) { var ex = A2.SX[i] - D.sing.x, ey = A2.SY[i] - D.sing.y; if (ex * ex + ey * ey < r * r) n++; } return n; }
  var n0 = near(sz.H * 0.12);
  run(3);
  var n1 = near(sz.H * 0.12);
  check('a singularidade junta os nós', n1 > n0 + 5, { antes: n0, depois: n1 });
  window.dispatchEvent(new MouseEvent('mouseup', { clientX: cx + 30, clientY: cy, button: 0 }));
  check('soltar explode (onda de choque)', D.sing.on === false && D.shocks().length >= 1, { on: D.sing.on, shocks: D.shocks().length });
  run(2);
  check('a explosão espalha os nós', near(sz.H * 0.12) < n1 / 2, near(sz.H * 0.12));
  document.dispatchEvent(new MouseEvent('mouseleave'));

  // Formações
  var kinds = S.shapes.KINDS.concat(['clock']), formed = [];
  kinds.forEach(function (kind) {
    D.relayout();
    run(0.5);
    var ok = D.shape(kind);
    run(5.5);
    if (ok && S.shapes.phase() === 2 && S.shapes.kind() === kind && locked() > 8) formed.push(kind);
    S.shapes.release(sz.unit);
  });
  check('todas as formações se montam e seguram', formed.length === kinds.length, { formadas: formed });
  // O relógio liga só os segmentos acesos (sem diagonais nem barras extras)
  D.relayout();
  run(0.5);
  D.shape('clock');
  run(5.5);
  var Lk = net.links(), Al = net.a(), among = 0;
  for (var li = 0; li < Lk.n; li++) if (Al.LOCK[Lk.a[li]] === 2 && Al.LOCK[Lk.b[li]] === 2) among++;
  check('relógio: ligações só pelos segmentos', net.edgeCount() > 10 && among === net.edgeCount(), { edges: net.edgeCount(), links: among });
  S.shapes.release(sz.unit);
  check('soltar o relógio apaga os segmentos', net.edgeCount() === 0, net.edgeCount());
  check('soltar a formação libera os nós', locked() === 0, locked());
  D.relayout();
  app.setValue('shapefreq', 1);
  var c0 = D.shapeCount();
  run(90, 0.25);
  check('formações aparecem sozinhas', D.shapeCount() > c0, D.shapeCount() - c0);
  app.setValue('shapes', false);
  run(0.2);
  check('desligar as formações solta a atual', !S.shapes.active() && locked() === 0, locked());
  app.setValue('shapes', true);
  app.setValue('shapefreq', 30);

  // Relógio de partículas (a fonte padrão do relógio)
  var realNow = Date.now, frozen = Date.now();
  Date.now = function () { return frozen; };   // the clock's time moves only with timeShift
  var t0 = Math.floor((frozen - new Date().getTimezoneOffset() * 60000) / 1000), shift = 0;
  function tick(sec) { for (var f = 0; f < sec * 30; f++) { shift += 1000 / 30; D.timeShift(shift); D.step(1 / 30); } }
  function lock3() { var A3 = net.a(), n = 0; for (var i = 0; i < net.n(); i++) if (A3.LOCK[i] === 3) n++; return n; }
  shift = ((3600 - 40 - t0 % 3600 + 3600) % 3600) * 1000;   // hh:59:20
  D.timeShift(shift);
  app.setValue('clock', true);
  check('relógio de partículas é a fonte padrão', eff().clockfont === 'particles', eff().clockfont);
  tick(3);
  check('a rede desenha o relógio', D.pclock().n > 20 && lock3() === D.pclock().n, { n: D.pclock().n, lock3: lock3() });
  var Lc = net.links(), Ac = net.a(), amongC = 0;
  for (var lc = 0; lc < Lc.n; lc++) if (Ac.LOCK[Lc.a[lc]] === 3 && Ac.LOCK[Lc.b[lc]] === 3) amongC++;
  check('relógio: ligações só pelos segmentos', net.edgeCount(1) > 20 && amongC === net.edgeCount(1), { edges: net.edgeCount(1), links: amongC });
  var before3 = lock3();
  D.hold(D.pclock().center.x, D.pclock().center.y);
  tick(2);
  var eaten3 = lock3();
  D.release();
  check('a singularidade come o relógio', eaten3 < before3 - 5, { antes: before3, durante: eaten3 });
  tick(10);
  Lc = net.links(); Ac = net.a(); amongC = 0;
  for (lc = 0; lc < Lc.n; lc++) if (Ac.LOCK[Lc.a[lc]] === 3 && Ac.LOCK[Lc.b[lc]] === 3) amongC++;
  check('o relógio se regenera devagar', lock3() === D.pclock().n && lock3() > 20 && amongC === net.edgeCount(1), { nos: lock3(), pontos: D.pclock().n, edges: net.edgeCount(1), links: amongC });
  tick(1);
  D.shape('sphere');
  tick(1);
  check('formação e relógio juntos', S.shapes.active() && D.pclock().n > 20, { shape: S.shapes.active(), clock: D.pclock().n });
  tick(20);   // hh:59:57
  check('perto da hora: relógio grande no centro, sem formação', D.pclock().hd && !S.shapes.active() && D.pclock().n > 100, D.pclock());
  var shocks0 = D.shocks().length;
  tick(3.5);  // hh:00:00.5
  check('na virada da hora: pulso de sobrecarga', D.shocks().length > shocks0 || net.signals().runners > 0, { shocks: D.shocks().length, runners: net.signals().runners });
  tick(7);    // hh:00:07.5
  check('depois volta ao lugar normal', !D.pclock().hd && D.pclock().n > 20 && D.pclock().n < 120, D.pclock());
  app.setValue('clockhour', false);
  shift = ((3600 - 3 - t0 % 3600 + 3600) % 3600) * 1000;
  tick(1);
  check('sem a opção da hora cheia, fica no lugar', !D.pclock().hd, D.pclock());
  app.setValue('clockhour', true);
  app.setValue('clockfont', 'segoe');
  tick(0.5);
  check('outra fonte: a rede solta o relógio', D.pclock().n === 0 && lock3() === 0, { n: D.pclock().n, lock3: lock3() });
  app.setValue('clockfont', 'particles');
  app.setValue('clock', false);
  D.timeShift(0);
  Date.now = realNow;

  // Voo pela rede: a rede continua inteira depois
  D.relayout();
  run(1);
  var vis0 = onScreen();
  check('voo começa', D.flight() === true && D.fly.t >= 0, D.fly.t);
  run(2);
  check('durante o voo há nós na tela', onScreen() > vis0 * 0.4, { antes: vis0, agora: onScreen() });
  run(3);
  check('voo termina e a rede fica na tela', D.fly.t === -1 && onScreen() > vis0 * 0.6, { t: D.fly.t, antes: vis0, depois: onScreen() });
  check('pouso: onda de choque num ponto aleatório (não no centro)', Math.hypot(D.fly.x - sz.W / 2, D.fly.y - sz.H / 2) > 1, { x: D.fly.x, y: D.fly.y });

  // Drop: o grave some por uns segundos com música tocando e volta com tudo → voo
  app.setValue('audioenabled', true);
  app.setValue('audiodrop', true);
  var arr = []; for (var x = 0; x < 128; x++) arr.push(0);
  function feed(bass, mid) { for (var bnd = 0; bnd < 64; bnd++) arr[bnd] = arr[bnd + 64] = bnd < 6 ? bass : mid; S.audio.feed(arr); }
  for (var t = 0; t < 120; t++) { feed(0.6 * ((t % 15) < 3 ? 1 : 0.3), 0.3); D.step(1 / 30); }
  for (t = 0; t < 120; t++) { feed(0.01, 0.35); D.step(1 / 30); }
  for (t = 0; t < 20; t++) { feed(0.9, 0.35); D.step(1 / 30); }
  check('drop dispara o voo', D.fly.t >= 0, { t: D.fly.t, last: S.audio.state.lastDrop });
  feed(0, 0);
  run(6);

  // Visualizador: qualquer som que dure ~3,5 s
  app.setValue('visualizer', true);
  if (S.shapes.active()) S.shapes.release(sz.unit);
  var tm = 0;
  function gauss(b, c, w) { return Math.exp(-((b - c) * (b - c)) / (2 * w * w)); }
  function song(sec, kind, dt2) {
    dt2 = dt2 || 1 / 30;
    for (var f2 = 0; f2 < sec / dt2; f2++) {
      tm += dt2;
      var kickV = Math.exp(-((tm % 0.5) / 0.5) * 8);
      for (var b2 = 0; b2 < 64; b2++) {
        var v2 = kind === 'calm' ? 0.3 * gauss(b2, 20, 2)
          : (b2 < 5 ? 0.9 * kickV : 0) + 0.5 * gauss(b2, 7, 1.6) + 0.45 * gauss(b2, 24, 4) + (b2 > 40 ? 0.4 * (((tm * 4) % 1) < 0.2 ? 1 : 0.2) : 0);
        arr[b2] = arr[b2 + 64] = Math.min(1, v2) * 0.6;
      }
      S.audio.feed(arr);
      D.step(dt2);
    }
  }
  function quiet(sec) { feed(0, 0); run(sec); }
  quiet(3);
  song(1.5);
  quiet(3);
  check('som curto (notificação) não dispara', S.shapes.kind() !== 'visualizer' && !D.music.sure, { kind: S.shapes.kind(), t: D.music.time });
  song(4.5, 'calm');
  check('música sem grave também dispara', S.shapes.kind() === 'visualizer', { kind: S.shapes.kind(), t: D.music.time });
  quiet(5);
  song(2);
  check('ainda não aos 2 s', S.shapes.kind() !== 'visualizer', S.shapes.kind());
  song(2.5);
  check('visualizador depois de ~3,5 s', S.shapes.kind() === 'visualizer' && D.music.sure, { kind: S.shapes.kind(), t: D.music.time });
  song(5);
  song(5);
  var Lv = net.links(), Av = net.a(), amongV = 0;
  for (var lv2 = 0; lv2 < Lv.n; lv2++) if (Av.LOCK[Lv.a[lv2]] === 2 && Av.LOCK[Lv.b[lv2]] === 2) amongV++;
  check('visualizador: a malha é só a dele', net.edgeCount() > 100 && amongV === net.edgeCount(), { edges: net.edgeCount(), links: amongV });
  // A singularidade come o visualizador; ele se regenera devagar
  function lock2() { var A2 = net.a(), n = 0; for (var i = 0; i < net.n(); i++) if (A2.LOCK[i] === 2) n++; return n; }
  var vz0 = lock2();
  D.hold(sz.W / 2, sz.H * 0.62);
  song(2);
  var vz1 = lock2();
  D.release();
  song(10);
  Lv = net.links(); Av = net.a(); amongV = 0;
  for (lv2 = 0; lv2 < Lv.n; lv2++) if (Av.LOCK[Lv.a[lv2]] === 2 && Av.LOCK[Lv.b[lv2]] === 2) amongV++;
  check('a singularidade come o visualizador e ele se regenera', S.shapes.kind() === 'visualizer' && vz1 < vz0 - 10 && lock2() === vz0 && amongV === net.edgeCount(),
    { antes: vz0, durante: vz1, depois: lock2(), edges: net.edgeCount(), links: amongV });
  // Uma formação no meio do visualizador: vira a formação (dançando) e volta
  D.shape('sphere');
  song(4);
  check('formação durante o visualizador', S.shapes.kind() === 'sphere', S.shapes.kind());
  S.shapes.release(sz.unit);
  song(0.5);
  check('depois da formação o visualizador volta', S.shapes.kind() === 'visualizer', S.shapes.kind());
  // Hora cheia com o visualizador: ele sobe, o relógio grande vai para baixo
  var realNow2 = Date.now, frozen2 = Date.now();
  Date.now = function () { return frozen2; };
  app.setValue('clock', true);
  D.timeShift(0);
  // Turning the particle clock on rebuilds the network: the visualizer comes back first
  song(1);
  D.hourIn(5);
  song(1.5);
  check('hora cheia com visualizador: ele sobe e o relógio fica embaixo',
    S.shapes.kind() === 'visualizer' && D.pclock().hd && D.pclock().center.y > sz.H * 0.6 && S.shapes.lift() > 0.5,
    { kind: S.shapes.kind(), clock: D.pclock(), lift: S.shapes.lift() });
  D.timeShift(0);
  app.setValue('clock', false);
  Date.now = realNow2;
  song(2);
  song(5, 'calm');
  check('trecho calmo da música: continua', S.shapes.kind() === 'visualizer', S.shapes.kind());
  quiet(2.5);
  song(3);
  check('troca de faixa (2,5 s de silêncio): continua', S.shapes.kind() === 'visualizer', S.shapes.kind());
  song(60, null, 0.1);
  check('música longa: continua depois de 1 min', S.shapes.kind() === 'visualizer', S.shapes.kind());
  quiet(5);
  check('a música parou: o visualizador se desfaz', S.shapes.kind() !== 'visualizer', S.shapes.kind());
  check('o túnel também se forma', D.visualizer('tunnel') && (run(4), S.shapes.kind() === 'visualizer' && S.shapes.vizStyle() === 'tunnel'), S.shapes.vizStyle());
  S.shapes.release(sz.unit);
  quiet(1);
  app.setValue('audioenabled', false);

  // Cores da capa do álbum (integração de mídia do WE)
  S.media.setStatus({ enabled: true });
  S.media.setThumbnail({ primaryColor: '#ff8800', secondaryColor: '#2244ff', tertiaryColor: '#222222' });
  S.media.setPlayback({ state: 1 });
  run(5);
  var L = D.live.A;
  check('céu toma as cores da capa', L[0] > L[1] && L[1] > L[2] && L[0] > 0.6, L);
  S.media.setPlayback({ state: 0 });
  run(14);
  var base = set.BY_KEY.nodecolor.def.split(' ').map(Number);
  L = D.live.A;
  check('música parou: volta às cores do tema', Math.abs(L[0] - base[0]) < 0.03 && Math.abs(L[2] - base[2]) < 0.03, { live: L, base: base });

  // A música no relógio
  app.setValue('clock', true);
  S.media.setProperties({ title: 'Teste de Música', artist: 'Banda' });
  S.media.setPlayback({ state: 1 });
  await sleep(700);
  var song = document.querySelector('#px-clock .px-clock-song');
  check('relógio mostra a música', song.classList.contains('px-show') && song.textContent.indexOf('Teste de Música') >= 0, song.textContent);
  S.media.setPlayback({ state: 0 });

  // Resolução e profundidade
  app.setValue('quality', '0.75');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  check('resolução 75%', D.size().W === Math.round(innerWidth * dpr * 0.75), D.size());
  app.setValue('quality', '0.5');
  app.setValue('depth', 0);
  run(2);
  A = net.a(); finite = true;
  for (q = 0; q < net.n(); q++) if (!isFinite(A.X[q] + A.Y[q] + A.Z[q] + A.SX[q])) finite = false;
  check('rede plana (sem profundidade) funciona', finite && net.links().n > 0 && D.shape('sphere'), net.links().n);
  run(4);
  S.shapes.release(sz.unit);
  app.setValue('depth', 1);

  // Temas: todos rodam sem erro
  var bad = [];
  set.PRESETS.forEach(function (p) {
    app.setValue('preset', p.id);
    try { run(0.3); } catch (e) { bad.push(p.id + ': ' + e.message); }
  });
  check('todos os temas rodam', !bad.length, bad);
  app.setValue('preset', 'circuit');

  // Idiomas
  var I = S.i18n;
  function sub() { return document.querySelector('#px-settings header .px-title span').textContent; }
  function lbl(k) { return document.querySelector('label[for=px-opt-' + k + ']').textContent; }
  app.setValue('language', 'pt');
  check('pt: menu em português', I.lang() === 'pt' && sub() === 'Configurações' && lbl('linkdist') === 'Distância de conexão', { sub: sub(), lbl: lbl('linkdist') });
  check('pt: tema padrão', document.querySelector('#px-opt-preset option[value=circuit]').textContent === 'Azul Circuito (Default)', null);
  app.setValue('language', 'pt-pt');
  check('pt-pt: usa o pt como base', sub() === 'Definições' && lbl('linkdist') === 'Distância de ligação' && lbl('depth') === 'Profundidade (3D)', { sub: sub(), lbl: lbl('linkdist') });
  app.setValue('language', 'en');
  check('en: menu em inglês', sub() === 'Settings' && lbl('linkdist') === 'Connection distance', sub());
  app.setValue('language', 'auto');
  window.wallpaperPropertyListener.applyGeneralProperties({ language: 'ru-ru' });
  check('auto: russo do WE', I.lang() === 'ru' && sub() === 'Настройки', { lang: I.lang(), sub: sub() });
  app.setValue('language', 'ar');
  check('árabe: menu da direita para a esquerda', document.getElementById('px-settings').dir === 'rtl', document.getElementById('px-settings').dir);
  app.setValue('language', 'en');

  // Pausa (WE / Live Wallpapers)
  window.wallpaperPropertyListener.setPaused(true);
  window.wallpaperPropertyListener.setPaused(false);
  check('pausar e retomar sem erro', true, null);

  results.push('ERROS: ' + JSON.stringify(window.__errs.slice(0, 5)) + ' total=' + window.__errs.length);
  document.getElementById('out').textContent = results.join(String.fromCharCode(10)) + String.fromCharCode(10) + 'DONE';
})();
</script>
</body>
</html>
